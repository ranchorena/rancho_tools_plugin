name: rancho-qa

services:
  frontend:
    build:
      context: ./raweb
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:5000} # El navegador llama a la API; backend:5000 no resuelve fuera de Docker
        GEOSERVER_URL: ${GEOSERVER_URL:-http://localhost:8087/geoserver} # Asume que GeoServer corre en el host o es accesible
        KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8081}
    image: raweb:qa
    container_name: raweb-qa
    ports:
      - "8082:8080"
    networks:
      - raweb-network
    depends_on:
      - backend
    environment:
      # Estas variables también se pasan al entorno de ejecución del contenedor,
      # aunque para Svelte/Rollup, los valores importantes son los usados en tiempo de BUILD (ver build.args).
      # Podrían ser útiles si el entrypoint del contenedor las usara para alguna tarea (no es el caso aquí).
      - API_URL=${API_URL:-http://localhost:5000}
      - GEOSERVER_URL=${GEOSERVER_URL:-http://localhost:8087/geoserver}

  backend:
    build:
      context: ./raapi
      dockerfile: Dockerfile
    image: raweb-api:qa      
    container_name: raweb-api-qa
    ports:
      - "5000:5000"
    networks:
      - raweb-network
    # db solo existe con --profile standalone. En DEV habitual no se espera.
    depends_on:
      db:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD debe estar definida en .env}
      - DB_HOST=${DB_HOST_DOCKER:-host.docker.internal}
      - DB_PORT=${DB_PORT_DOCKER:-5432}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_SCHEMA=${DB_SCHEMA:-generalbelgrano}
      - FLASK_APP=server.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_ENV=${FLASK_ENV:-production} # o development
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-http://localhost:8081/realms/rancho}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL_DOCKER:-http://keycloak:8080/realms/rancho/protocol/openid-connect/certs}
      - RA_API_AUDIENCE=${RA_API_AUDIENCE:-raapi}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8082}
    volumes:
      - ./raapi:/app # Opcional: para desarrollo, montar el código local en el contenedor

  # No forma parte del DEV habitual. La PostgreSQL de referencia corre en el host, puerto 5432.
  # Este servicio es para una instalación desde cero: docker compose --profile standalone up -d
  # y DB_HOST_DOCKER=db. La imagen sigue en postgres:13-alpine; no restaura el dump 1.16.
  # Ver db_init/README.md. No borrar el volumen postgres_data para reintentar la carga.
  db:
    profiles: ["standalone"]
    image: postgres:13-alpine
    container_name: raweb-db-qa
    ports:
      - "5433:5432" # Exponer puerto de la BD al host (5433) para evitar conflicto con local 5432
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD debe estar definida en .env}
      - POSTGRES_DB=${DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # El script solo corre en un volumen vacío. Lee el dump fechado, no generalbelgrano.dump.
      - ./db_init/generalbelgrano-20261014.dump:/docker-entrypoint-initdb.d/generalbelgrano-20261014.dump:ro
      - ./db_init/restore_dump.sh:/docker-entrypoint-initdb.d/restore_dump.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raweb-network

  # Base interna de Keycloak. No comparte schema ni volumen con la base de negocio.
  keycloak-db:
    image: postgres:16-alpine
    container_name: rancho-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - raweb-network

  # start-dev es exclusivo de este Compose local. Producción usa `start` con HTTPS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: rancho-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: "8080"
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - raweb-network

  # Una origen para el navegador. No reemplaza los puertos 8082, 5000, 8081 y 8087.
  proxy:
    image: nginx:1.27-alpine
    container_name: ra-proxy
    ports:
      - "8088:80"
    volumes:
      - ./ra-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
      - backend
      - keycloak
    networks:
      - raweb-network

  keycloak-bootstrap:
    image: python:3.12-alpine
    container_name: rancho-keycloak-bootstrap
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      RANCHO_DEMO_USER: ${RANCHO_DEMO_USER:-rancho}
      RANCHO_DEMO_PASSWORD: ${RANCHO_DEMO_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak/bootstrap/bootstrap_dev.py:/bootstrap_dev.py:ro
    entrypoint: ["python", "/bootstrap_dev.py"]
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - raweb-network

networks:
  raweb-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_db_data:
