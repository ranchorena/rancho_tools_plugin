[project]
name = "ra-mcp"
version = "0.1.0"
description = "Servidor MCP para buscar clientes y registrar pedidos a través de raapi."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ra-mcp = "ra_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
