# Una sola entrada para el navegador: http://localhost:8088 o el https de ngrok.
# El JavaScript de raweb se compila con esa misma origen:
#   API_URL=http://localhost:8088
#   GEOSERVER_URL=http://localhost:8088/geoserver
#   KEYCLOAK_URL=http://localhost:8088
# Keycloak debe anunciar esa origen (KC_HOSTNAME) y aceptar el regreso a http://localhost:8088/.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Docker resuelve los servicios al pedirlos. GeoServer está en el host.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Si ngrok ya terminó TLS, conservar https hacia Keycloak y la API.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        listen [::]:80;
        client_max_body_size 8m;

        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;

        location /api/ {
            set $raapi backend:5000;
            proxy_pass http://$raapi;
        }

        location = /health {
            set $raapi backend:5000;
            proxy_pass http://$raapi;
        }

        # host.docker.internal está en /etc/hosts del contenedor, no en el DNS de Docker.
        location /geoserver/ {
            proxy_pass http://host.docker.internal:8087;
        }

        location /realms/ {
            set $keycloak keycloak:8080;
            proxy_pass http://$keycloak;
        }

        location /resources/ {
            set $keycloak keycloak:8080;
            proxy_pass http://$keycloak;
        }

        location /admin/ {
            set $keycloak keycloak:8080;
            proxy_pass http://$keycloak;
        }

        location / {
            set $raweb frontend:8080;
            proxy_pass http://$raweb;
        }
    }
}
