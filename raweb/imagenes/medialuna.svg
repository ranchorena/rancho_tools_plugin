<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100" height="85" viewBox="0 0 100 85" version="1.1" role="img"
     aria-labelledby="title desc">
  <title id="title">Medialuna</title>
  <desc id="desc">Ilustración vectorial de una medialuna amarilla con contorno negro y cuatro secciones.</desc>
  <g stroke="#171508" stroke-linecap="round" stroke-linejoin="round">
    <!-- Silueta: trazado vectorial cerrado -->
    <path id="silueta" fill="#FFCD05" stroke-width="3.5"
      d="M 9.4,51.3
         C 7.4,47.6 9.3,39.0 12.9,31.9
         C 16.8,24.1 23.6,16.5 32.9,11.8
         C 40.7,7.8 48.2,6.1 53.3,8.6
         C 66.0,10.5 73.8,17.5 78.9,25.5
         C 81.9,30.2 85.6,35.0 83.5,39.6
         C 81.5,43.0 76.8,40.0 72.4,37.6
         C 67.3,34.8 63.0,34.8 58.4,36.9
         C 50.9,40.3 44.0,44.4 40.5,49.2
         C 36.7,54.6 36.4,61.2 38.1,66.7
         C 39.0,70.1 40.3,74.9 38.7,76.6
         C 36.8,79.0 33.2,76.8 29.5,74.7
         C 23.5,71.5 18.1,67.6 14.6,63.7
         C 11.5,60.3 10.4,55.0 9.4,51.3 Z"/>
    <!-- División de la masa principal -->
    <path id="separacion-central" fill="none" stroke-width="3.2"
      d="M 52.6,8.7 C 57.3,15.1 60.7,26.1 61.1,36.0"/>
    <!-- División del extremo derecho -->
    <path id="separacion-punta-derecha" fill="none" stroke-width="2.8"
      d="M 78.5,25.7 C 76.0,28.9 73.7,33.3 72.4,37.7"/>
    <!-- División del extremo izquierdo -->
    <path id="separacion-izquierda" fill="none" stroke-width="3.3"
      d="M 9.1,51.3 C 17.8,46.9 29.6,45.8 40.5,49.2"/>
    <!-- Pliegue de la punta inferior -->
    <path id="separacion-punta-inferior" fill="none" stroke-width="3.1"
      d="M 16.4,64.0 C 23.0,60.3 29.9,59.1 37.1,60.5"/>
  </g>
</svg>
